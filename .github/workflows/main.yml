name: Deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Project with Maven
        run: |
          echo "Construindo o projeto..."
          mvn clean install

  test:
    runs-on: ubuntu-22.04
    needs: build
    services:
      mongo:
        image: mongo
        ports:
          - 27017:27017
      rabbitmq:
        image: "rabbitmq:management"
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Esperar o RabbitMQ iniciar
        run: |
          for i in {1..30}; do
            nc -z localhost 5672 && echo "RabbitMQ está rodando!" && exit 0
            echo "Aguardando RabbitMQ..."
            sleep 2
          done
          echo "RabbitMQ não iniciou!" && exit 1

      - name: Run Tests
        run: |
          mvn test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/site/jacoco/jacoco.xml  # Ajuste para o caminho correto do seu relatório de cobertura

  deploy_pre:
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar variáveis no Heroku
        run: |
          heroku config:set MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} --app production-orders
          heroku config:set RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }} --app production-orders
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "production-orders"
          heroku_email: "kaique.motta@hotmail.com"

  deploy_prod:
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar variáveis no Heroku
        run: |
          heroku config:set MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} --app production-orders
          heroku config:set RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }} --app production-orders
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "production-orders"
          heroku_email: "kaique.motta@hotmail.com"

  check_coverage:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar cobertura mínima
        run: |
          coverage_report=$(cat target/site/jacoco/jacoco.xml)
          # Exemplo simples de verificação de cobertura (ajuste conforme necessário)
          if [[ $(grep -o 'lines-covered' <<< "$coverage_report" | wc -l) -lt 70 ]]; then
            echo "Cobertura abaixo do esperado!" && exit 1
          fi
